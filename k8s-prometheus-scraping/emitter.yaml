apiVersion: batch/v1
kind: Job
metadata:
  name: emitter
  namespace: default
spec:
  # 6000 completions × 50 parallelism = 120 batches.
  # Each pod serves /metrics for 10 s → ~20 minutes of pod churn.
  completions: 600
  parallelism: 5
  template:
    metadata:
      labels:
        app: emitter
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port:   "9090"
        prometheus.io/path:   "/metrics"
    spec:
      containers:
        - name: emitter
          image: python:3.12-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 9090
          command:
            - python3
            - -c
            - |
              import http.server, threading, time, os

              hostname = os.getenv('HOSTNAME', 'unknown')
              start    = time.time()

              class H(http.server.BaseHTTPRequestHandler):
                  def do_GET(self):
                      if self.path != '/metrics':
                          self.send_response(404)
                          self.end_headers()
                          return
                      uptime = time.time() - start
                      body = (
                          '# HELP bench_uptime_seconds Seconds this pod has been running\n'
                          '# TYPE bench_uptime_seconds gauge\n'
                          f'bench_uptime_seconds{{pod="{hostname}"}} {uptime:.1f}\n'
                      ).encode()
                      self.send_response(200)
                      self.send_header('Content-Type', 'text/plain; version=0.0.4')
                      self.send_header('Content-Length', str(len(body)))
                      self.end_headers()
                      self.wfile.write(body)
                  def log_message(self, *a):
                      pass

              threading.Thread(
                  target=http.server.HTTPServer(('', 9090), H).serve_forever,
                  daemon=True,
              ).start()
              print(f'bench start pod={hostname}', flush=True)
              time.sleep(10)
              print(f'bench done pod={hostname}', flush=True)
      restartPolicy: Never
  backoffLimit: 0
