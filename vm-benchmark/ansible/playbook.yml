        timeout: 300
        method: POST
        headers:
          kbn-xsrf: "true"
        body_format: json
        body:
          name: "system-1"
          namespace: "default"
          policy_ids:
            - "{{ agent_monitoring_policy_id }}"
          package:
            name: "system"
            version: "{{ system_pkg.json['item']['version'] }}"
          inputs:
            - type: "logfile"
              enabled: true
              streams:
                - enabled: true
                  data_stream: {type: logs, dataset: system.auth}
                  vars:
                    paths:
                      value: [/var/log/auth.log, /var/log/secure]
                      type: text
                    preserve_original_event: {value: false, type: bool}
                - enabled: true
                  data_stream: {type: logs, dataset: system.syslog}
                  vars:
                    paths:
                      value: [/var/log/messages, /var/log/syslog, /var/log/system.log]
                      type: text
                    preserve_original_event: {value: false, type: bool}
            - type: "system/metrics"
              enabled: true
              streams:
                - enabled: true
                  data_stream: {type: metrics, dataset: system.cpu}
                  vars:
                    period: {value: "10s", type: text}
                    cpu.metrics: {value: [percentages, normalized_percentages], type: text}
                - enabled: true
                  data_stream: {type: metrics, dataset: system.diskio}
                  vars:
                    period: {value: "10s", type: text}
                - enabled: true
                  data_stream: {type: metrics, dataset: system.filesystem}
                  vars:
                    period: {value: "1m", type: text}
                    processors:
                      value: |
                        - drop_event.when.regexp:
                            system.filesystem.mount_point: ^/(sys|cgroup|proc|dev|etc|host|lib|snap)($|/)
                      type: yaml
                - enabled: true
                  data_stream: {type: metrics, dataset: system.fsstat}
                  vars:
                    period: {value: "1m", type: text}
                    processors: {value: null, type: yaml}
                - enabled: true
                  data_stream: {type: metrics, dataset: system.load}
                  vars:
                    period: {value: "10s", type: text}
                - enabled: true
                  data_stream: {type: metrics, dataset: system.memory}
                  vars:
                    period: {value: "10s", type: text}
                - enabled: true
                  data_stream: {type: metrics, dataset: system.network}
                  vars:
                    period: {value: "10s", type: text}
                - enabled: true
                  data_stream: {type: metrics, dataset: system.process}
                  vars:
                    period: {value: "10s", type: text}
                    process.include_top_n.by_cpu: {value: 5, type: integer}
                    process.include_top_n.by_memory: {value: 5, type: integer}
                    processes: {value: [".*"], type: text}
                - enabled: true
                  data_stream: {type: metrics, dataset: system.process.summary}
                  vars:
                    period: {value: "10s", type: text}
                - enabled: true
                  data_stream: {type: metrics, dataset: system.socket_summary}
