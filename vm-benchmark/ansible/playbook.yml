                - enabled: true
                  data_stream: {type: metrics, dataset: elasticsearch.stack_monitoring.pending_tasks}
                  vars: {period: {value: "10s", type: text}}
                - enabled: true
                  data_stream: {type: metrics, dataset: elasticsearch.stack_monitoring.shard}
                  vars: {period: {value: "10s", type: text}}
                - enabled: true
                  data_stream: {type: metrics, dataset: elasticsearch.stack_monitoring.security_stats}
                  vars: {period: {value: "10s", type: text}}
        user: elastic
        password: "{{ elastic_password }}"
        force_basic_auth: true
        ca_path: "{{ certs_dir }}/ca.crt"
        status_code: [200, 201, 409]
      delegate_to: localhost
      become: false
      when: (es_metrics_package_policies.json['items'] | selectattr('package', 'defined') | selectattr('package.name', 'equalto', 'elasticsearch') | list | length) == 0

  handlers:
    - name: Restart Kibana
      ansible.builtin.systemd:
        name: kibana
        state: restarted

# Play 5: Install and configure Fleet Server
- name: Install and configure Fleet Server
  hosts: fleet_server
  become: true
  vars_files: [vars.yml]
  any_errors_fatal: true

  tasks:
    - name: Check if elastic-agent fleet-server component is installed
      ansible.builtin.shell: |
        ls /opt/Elastic/Agent/data/elastic-agent-*/components/fleet-server 2>/dev/null && echo found || echo missing
      register: fleet_server_check
      changed_when: false

    - name: Download elastic-agent tar.gz
      ansible.builtin.get_url:
        url: "https://artifacts.elastic.co/downloads/beats/elastic-agent/elastic-agent-{{ elastic_version }}-linux-{{ tgz_arch }}.tar.gz"
        dest: "/var/tmp/elastic-agent-{{ elastic_version }}.tar.gz"
        mode: '0644'
        timeout: 300
      when: not (elastic_is_snapshot | bool) and fleet_server_check.stdout == "missing"

    - name: Look up elastic-agent snapshot tar.gz URL
      ansible.builtin.uri:
        url: "{{ elastic_artifacts_api }}/elastic-agent-{{ elastic_version }}-linux-{{ tgz_arch }}.tar.gz"
        timeout: 300
        return_content: true
      register: fleet_agent_artifact
      delegate_to: localhost
      run_once: true
      become: false
      when: (elastic_is_snapshot | bool) and fleet_server_check.stdout == "missing"

    - name: Download elastic-agent snapshot tar.gz
      ansible.builtin.get_url:
        url: "{{ fleet_agent_artifact.json.packages['elastic-agent-' + elastic_version + '-linux-' + tgz_arch + '.tar.gz'].url }}"
        dest: "/var/tmp/elastic-agent-{{ elastic_version }}.tar.gz"
        timeout: 300
      register: agent_snapshot_tgz_dl
      until: agent_snapshot_tgz_dl is succeeded
      retries: 3
      delay: 15
      when: (elastic_is_snapshot | bool) and fleet_server_check.stdout == "missing"

    - name: Extract elastic-agent
      ansible.builtin.unarchive:
        src: "/var/tmp/elastic-agent-{{ elastic_version }}.tar.gz"
        dest: /var/tmp/
        remote_src: true
      when: fleet_server_check.stdout == "missing"

    - name: Install elastic-agent with server components
      ansible.builtin.command:
        cmd: ./elastic-agent install --non-interactive --install-servers --force
        chdir: "/var/tmp/elastic-agent-{{ elastic_version }}-linux-{{ tgz_arch }}"
      when: fleet_server_check.stdout == "missing"

    - name: Remove elastic-agent installer
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - "/var/tmp/elastic-agent-{{ elastic_version }}.tar.gz"
        - "/var/tmp/elastic-agent-{{ elastic_version }}-linux-{{ tgz_arch }}"
      when: fleet_server_check.stdout == "missing"

    - name: Create certs directory
      ansible.builtin.file:
        path: /etc/elastic-agent/certs
        state: directory
        owner: root
        group: root
        mode: '0700'

    - name: Copy CA certificate
      ansible.builtin.copy:
        src: "{{ certs_dir }}/ca.crt"
        dest: /etc/elastic-agent/certs/ca.crt
        owner: root
        group: root
        mode: '0600'
      register: fleet_ca_cert

    - name: Copy Fleet Server certificate
      ansible.builtin.copy:
        src: "{{ certs_dir }}/fleet.crt"
        dest: /etc/elastic-agent/certs/fleet.crt
        owner: root
        group: root
        mode: '0600'

    - name: Copy Fleet Server private key
      ansible.builtin.copy:
        src: "{{ certs_dir }}/fleet.key"
        dest: /etc/elastic-agent/certs/fleet.key
        owner: root
        group: root
        mode: '0600'

    - name: Stop elastic-agent for Fleet Server enrollment
      ansible.builtin.systemd:
        name: elastic-agent
        state: stopped
      failed_when: false

    - name: Enroll elastic-agent as Fleet Server
      ansible.builtin.command:
        cmd: >
          elastic-agent enroll
          --url=https://{{ ansible_host }}:8220
          --fleet-server-es=https://{{ hostvars['elasticsearch']['internal_ip'] | default(hostvars['elasticsearch']['ansible_host']) }}:9200
          --fleet-server-service-token={{ hostvars['elasticsearch']['fleet_service_token'] }}
          --fleet-server-policy={{ hostvars['kibana']['fleet_server_policy_id'] }}
          --fleet-server-es-ca=/etc/elastic-agent/certs/ca.crt
          --fleet-server-cert=/etc/elastic-agent/certs/fleet.crt
          --fleet-server-cert-key=/etc/elastic-agent/certs/fleet.key
          --certificate-authorities=/etc/elastic-agent/certs/ca.crt
          --force
      failed_when: false

    - name: Start elastic-agent after Fleet Server enrollment
      ansible.builtin.systemd:
        name: elastic-agent
        state: started

    - name: Wait for Fleet Server to be ready
      ansible.builtin.uri:
        url: "https://{{ internal_ip | default(ansible_host) }}:8220/api/status"
        timeout: 30
        ca_path: /etc/elastic-agent/certs/ca.crt
        return_content: true
        status_code: [200]
      register: fleet_status
      until: fleet_status.status == 200 and fleet_status.json is defined and fleet_status.json.status == "HEALTHY"
      retries: 30
      delay: 10

# Play 6: Install Apache and HAProxy on elastic-agent VMs
- name: Install Apache and HAProxy on elastic-agent VMs
  hosts: elastic_agents
  become: true
  any_errors_fatal: true
  vars_files: [vars.yml]

  tasks:
    - name: Install Apache
      ansible.builtin.apt:
        name: apache2
        state: present
        update_cache: true

    - name: Enable and start Apache
      ansible.builtin.systemd:
        name: apache2
        enabled: true
        state: started

    - name: Enable mod_status
      ansible.builtin.command: a2enmod status
      notify: Restart Apache

    - name: Install HAProxy
      ansible.builtin.apt:
        name: haproxy
        state: present

    - name: Deploy HAProxy configuration
      ansible.builtin.template:
        src: templates/haproxy.cfg.j2
        dest: /etc/haproxy/haproxy.cfg
        owner: root
        group: root
        mode: '0644'
      notify: Restart HAProxy

    - name: Enable and start HAProxy
      ansible.builtin.systemd:
        name: haproxy
        enabled: true
        state: started

  handlers:
    - name: Restart Apache
      ansible.builtin.systemd:
        name: apache2
        state: restarted

    - name: Restart HAProxy
      ansible.builtin.systemd:
        name: haproxy
        state: restarted

# Play 6b: Install Vegeta and loggen on generator VMs
- name: Install Vegeta and loggen on generator VMs
  hosts: generators
  become: true
  any_errors_fatal: true
  vars_files: [vars.yml]

  tasks:
    - name: Download Vegeta
      ansible.builtin.get_url:
        url: "https://github.com/tsenart/vegeta/releases/download/v{{ vegeta_version }}/vegeta_{{ vegeta_version }}_linux_{{ elastic_deb_arch }}.tar.gz"
        dest: /tmp/vegeta.tar.gz
        mode: '0644'
        timeout: 300

    - name: Install Vegeta binary
      ansible.builtin.unarchive:
        src: /tmp/vegeta.tar.gz
        dest: /usr/local/bin
        remote_src: true
        include: [vegeta]
        mode: '0755'

    - name: Install loggen
      ansible.builtin.apt:
        name: syslog-ng-core
        state: present
        update_cache: true

    - name: Install vegeta systemd unit
      ansible.builtin.template:
        src: templates/vegeta.service.j2
        dest: /etc/systemd/system/vegeta.service
        owner: root
        group: root
        mode: '0644'

    - name: Create loggen config directory
      ansible.builtin.file:
        path: /etc/loggen
        state: directory
        owner: root
        group: root
        mode: '0755'

    - name: Install loggen CEF sample messages
      ansible.builtin.copy:
        src: files/cef.log
        dest: /etc/loggen/cef.log
        owner: root
        group: root
        mode: '0644'

    - name: Install loggen systemd unit
      ansible.builtin.template:
        src: templates/loggen.service.j2
        dest: /etc/systemd/system/loggen.service
        owner: root
        group: root
        mode: '0644'

    - name: Reload systemd after unit file install
      ansible.builtin.systemd:
        daemon_reload: true

# Play 7: Install and enroll elastic-agent on elastic-agent VMs
- name: Install and enroll elastic-agent on elastic-agent VMs
  hosts: elastic_agents
  become: true
  any_errors_fatal: true
  vars_files: [vars.yml]

  tasks:
    - name: Check if elastic-agent is already installed
      ansible.builtin.stat:
        path: /opt/Elastic/Agent/elastic-agent
      register: ea_installed

    - name: Download elastic-agent tar.gz
      ansible.builtin.get_url:
        url: "https://artifacts.elastic.co/downloads/beats/elastic-agent/elastic-agent-{{ agent_version }}-linux-{{ tgz_arch }}.tar.gz"
        dest: "/var/tmp/elastic-agent-{{ agent_version }}.tar.gz"
        mode: '0644'
        timeout: 300
      when: not (agent_is_snapshot | bool) and not ea_installed.stat.exists

    - name: Look up elastic-agent snapshot tar.gz URL
      ansible.builtin.uri:
        url: "{{ agent_artifacts_api }}/elastic-agent-{{ agent_version }}-linux-{{ tgz_arch }}.tar.gz"
        timeout: 300
        return_content: true
      register: agent_artifact
      delegate_to: localhost
      run_once: true
      become: false
      when: (agent_is_snapshot | bool) and not ea_installed.stat.exists

    - name: Download elastic-agent snapshot tar.gz
      ansible.builtin.get_url:
        url: "{{ agent_artifact.json.packages['elastic-agent-' + agent_version + '-linux-' + tgz_arch + '.tar.gz'].url }}"
        dest: "/var/tmp/elastic-agent-{{ agent_version }}.tar.gz"
        timeout: 300
      register: agent_snapshot_tgz_dl
      until: agent_snapshot_tgz_dl is succeeded
      retries: 3
      delay: 15
      when: (agent_is_snapshot | bool) and not ea_installed.stat.exists

    - name: Extract elastic-agent
      ansible.builtin.unarchive:
        src: "/var/tmp/elastic-agent-{{ agent_version }}.tar.gz"
        dest: /var/tmp/
        remote_src: true
      when: not ea_installed.stat.exists

    - name: Install elastic-agent
      ansible.builtin.command:
        cmd: ./elastic-agent install --non-interactive
        chdir: "/var/tmp/elastic-agent-{{ agent_version }}-linux-{{ tgz_arch }}"
      when: not ea_installed.stat.exists

    - name: Remove elastic-agent installer
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - "/var/tmp/elastic-agent-{{ agent_version }}.tar.gz"
        - "/var/tmp/elastic-agent-{{ agent_version }}-linux-{{ tgz_arch }}"
      when: not ea_installed.stat.exists

    - name: Create certs directory
      ansible.builtin.file:
        path: /etc/elastic-agent/certs
        state: directory
        owner: root
        group: root
        mode: '0700'

    - name: Copy CA certificate
      ansible.builtin.copy:
        src: "{{ certs_dir }}/ca.crt"
        dest: /etc/elastic-agent/certs/ca.crt
        owner: root
        group: root
        mode: '0600'
      register: agent_ca_cert

    - name: Stop elastic-agent for enrollment
      ansible.builtin.systemd:
        name: elastic-agent
        state: stopped
      failed_when: false

    - name: Enroll elastic-agent with Fleet
      ansible.builtin.command:
        cmd: >
          elastic-agent enroll
          --url=https://{{ hostvars['fleet_server']['internal_ip'] | default(hostvars['fleet_server']['ansible_host']) }}:8220
          --enrollment-token={{ hostvars['kibana']['agent_monitoring_enrollment_token'] }}
          --certificate-authorities=/etc/elastic-agent/certs/ca.crt
          --force
      failed_when: false

    - name: Start elastic-agent after enrollment
      ansible.builtin.systemd:
        name: elastic-agent
        state: started

    - name: Read elastic-agent ID
      ansible.builtin.shell: >
        elastic-agent status --output json 2>/dev/null
        | python3 -c 'import json,sys; print(json.load(sys.stdin)["info"]["id"])'
      register: ea_id
      retries: 30
      delay: 5
      until: ea_id.rc == 0 and (ea_id.stdout | trim | length) > 0
      changed_when: false

    - name: Record elastic-agent ID as host fact
      ansible.builtin.set_fact:
        elastic_agent_id: "{{ ea_id.stdout | trim }}"

    - name: Check every agent VM recorded an elastic-agent ID
      ansible.builtin.assert:
        that: missing_agent_ids | length == 0
        fail_msg: "No elastic-agent ID for {{ missing_agent_ids | join(', ') }}; check earlier task failures on those hosts"
      vars:
        missing_agent_ids: "{{ groups['elastic_agents'] | map('extract', hostvars) | selectattr('elastic_agent_id', 'undefined') | map(attribute='inventory_hostname') | list }}"
      run_once: true
      delegate_to: localhost
      become: false
      when: agent_ids_file is defined

    - name: Write elastic-agent IDs for orca
      ansible.builtin.copy:
        dest: "{{ agent_ids_file }}"
        mode: '0644'
        content: >-
          {{ dict(groups['elastic_agents']
             | zip(groups['elastic_agents'] | map('extract', hostvars, 'elastic_agent_id')))
             | to_nice_json }}
      run_once: true
      delegate_to: localhost
      become: false
      when: agent_ids_file is defined

