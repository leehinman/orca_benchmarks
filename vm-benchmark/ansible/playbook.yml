---
# Play 1: Prepare all VMs. The optional dist-upgrade is off by default: it
# downloads a new kernel on every fresh VM, which has taken 30+ minutes on
# slow mirrors, and the benchmark does not need it. Enable with -e dist_upgrade=true.
- name: Prepare all VMs
  hosts: all
  become: true
  gather_facts: false
  any_errors_fatal: true
  vars:
    dist_upgrade: false

  tasks:
    - name: Wait for SSH to come up
      ansible.builtin.wait_for_connection:
        delay: 5
        sleep: 5
        timeout: 600

    - name: Wait for cloud-init to finish
      ansible.builtin.command: cloud-init status --wait
      changed_when: false
      failed_when: false

    - name: Update apt cache
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 0

    - name: Hold Elastic packages during dist-upgrade
      ansible.builtin.shell: >
        apt-mark hold
        elasticsearch kibana elastic-agent fleet-server
        2>/dev/null || true
      changed_when: false
      when: dist_upgrade | bool

    - name: Dist-upgrade (skip unfetchable packages)
      ansible.builtin.shell: apt-get -y -o Acquire::Retries=3 --fix-missing dist-upgrade
      register: dist_upgrade_result
      changed_when: "'0 upgraded' not in dist_upgrade_result.stdout"
      ignore_errors: true
      timeout: 1200
      when: dist_upgrade | bool

    - name: Wait for background apt and dpkg processes to finish
      ansible.builtin.shell: pgrep -x 'apt-get|apt|dpkg' || pgrep -f '/usr/bin/unattended-upgrade( |$)'
      register: apt_procs
      until: apt_procs.rc == 1
      retries: 120
      delay: 10
      failed_when: apt_procs.rc not in [0, 1]
      changed_when: false
      when: dist_upgrade | bool

    - name: Unhold Elastic packages after dist-upgrade
      ansible.builtin.shell: >
        apt-mark unhold
        elasticsearch kibana elastic-agent fleet-server
        2>/dev/null || true
      changed_when: false
      when: dist_upgrade | bool

# Play 2: Generate TLS certificates on the control node
- name: Generate TLS certificates
  hosts: localhost
  connection: local
  gather_facts: false
  any_errors_fatal: true

  tasks:
    - name: Create certs directory
      ansible.builtin.file:
        path: "{{ certs_dir }}"
        state: directory
        mode: '0700'

    - name: Generate CA private key
      community.crypto.openssl_privatekey:
        path: "{{ certs_dir }}/ca.key"
        size: 4096

    - name: Generate CA CSR
      community.crypto.openssl_csr_pipe:
        privatekey_path: "{{ certs_dir }}/ca.key"
        common_name: "Benchmark CA"
        use_common_name_for_san: false
        basic_constraints:
          - "CA:TRUE"
        basic_constraints_critical: true
        key_usage:
          - keyCertSign
          - cRLSign
        key_usage_critical: true
      register: ca_csr

    - name: Generate self-signed CA certificate
      community.crypto.x509_certificate:
        path: "{{ certs_dir }}/ca.crt"
        privatekey_path: "{{ certs_dir }}/ca.key"
        csr_content: "{{ ca_csr.csr }}"
        provider: selfsigned
        selfsigned_not_after: "+3650d"

    - name: Generate Elasticsearch private key
      community.crypto.openssl_privatekey:
        path: "{{ certs_dir }}/es.key"
        size: 2048

    - name: Generate Elasticsearch CSR
      community.crypto.openssl_csr_pipe:
        privatekey_path: "{{ certs_dir }}/es.key"
        common_name: "elasticsearch"
        subject_alt_name:
          - "IP:{{ hostvars['elasticsearch']['ansible_host'] }}"
          - "IP:{{ hostvars['elasticsearch']['internal_ip'] | default(hostvars['elasticsearch']['ansible_host']) }}"
          - "DNS:elasticsearch"
      register: es_csr

    - name: Generate Elasticsearch certificate
      community.crypto.x509_certificate:
        path: "{{ certs_dir }}/es.crt"
        csr_content: "{{ es_csr.csr }}"
        ownca_path: "{{ certs_dir }}/ca.crt"
        ownca_privatekey_path: "{{ certs_dir }}/ca.key"
        provider: ownca
        ownca_not_after: "+3650d"

    - name: Generate Kibana private key
      community.crypto.openssl_privatekey:
        path: "{{ certs_dir }}/kibana.key"
        size: 2048

    - name: Generate Kibana CSR
      community.crypto.openssl_csr_pipe:
        privatekey_path: "{{ certs_dir }}/kibana.key"
        common_name: "kibana"
        subject_alt_name:
          - "IP:{{ hostvars['kibana']['ansible_host'] }}"
          - "IP:{{ hostvars['kibana']['internal_ip'] | default(hostvars['kibana']['ansible_host']) }}"
          - "DNS:kibana"
      register: kibana_csr

    - name: Generate Kibana certificate
      community.crypto.x509_certificate:
        path: "{{ certs_dir }}/kibana.crt"
        csr_content: "{{ kibana_csr.csr }}"
        ownca_path: "{{ certs_dir }}/ca.crt"
        ownca_privatekey_path: "{{ certs_dir }}/ca.key"
        provider: ownca
        ownca_not_after: "+3650d"

    - name: Generate Fleet Server private key
      community.crypto.openssl_privatekey:
        path: "{{ certs_dir }}/fleet.key"
        size: 2048

    - name: Generate Fleet Server CSR
      community.crypto.openssl_csr_pipe:
        privatekey_path: "{{ certs_dir }}/fleet.key"
        common_name: "fleet-server"
        subject_alt_name:
          - "IP:{{ hostvars['fleet_server']['ansible_host'] }}"
          - "IP:{{ hostvars['fleet_server']['internal_ip'] | default(hostvars['fleet_server']['ansible_host']) }}"
          - "DNS:fleet-server"
      register: fleet_csr

    - name: Generate Fleet Server certificate
      community.crypto.x509_certificate:
        path: "{{ certs_dir }}/fleet.crt"
        csr_content: "{{ fleet_csr.csr }}"
        ownca_path: "{{ certs_dir }}/ca.crt"
        ownca_privatekey_path: "{{ certs_dir }}/ca.key"
        provider: ownca
        ownca_not_after: "+3650d"

# Play 3: Install and configure Elasticsearch
- name: Install and configure Elasticsearch
  hosts: elasticsearch
  become: true
  any_errors_fatal: true
  vars_files: [vars.yml]

  tasks:
    - name: Install prerequisites
      ansible.builtin.apt:
        name:
          - apt-transport-https
          - gnupg
          - curl
        state: present
        update_cache: true

    - name: Add Elastic GPG key
      ansible.builtin.shell:
        cmd: curl -fsSL https://artifacts.elastic.co/GPG-KEY-elasticsearch | gpg --dearmor -o /usr/share/keyrings/elasticsearch-keyring.gpg
        creates: /usr/share/keyrings/elasticsearch-keyring.gpg

    - name: Install Elasticsearch via apt repository
      when: not (elastic_is_snapshot | bool)
      block:
        - name: Add Elastic apt repository
          ansible.builtin.apt_repository:
            repo: "deb [signed-by=/usr/share/keyrings/elasticsearch-keyring.gpg] {{ elastic_repo_url }} stable main"
            state: present
            filename: "elastic-{{ elastic_major_version }}.x"
        - name: Install Elasticsearch
          ansible.builtin.apt:
            name: "elasticsearch={{ elastic_version_apt }}"
            state: present
            update_cache: true
            allow_downgrade: true

    - name: Install Elasticsearch from snapshot deb
      when: elastic_is_snapshot | bool
      block:
        - name: Look up Elasticsearch snapshot package URL
          ansible.builtin.uri:
            url: "{{ elastic_artifacts_api }}/elasticsearch-{{ elastic_version }}-{{ elastic_deb_arch }}.deb"
            timeout: 300
            return_content: true
          register: es_artifact
          delegate_to: localhost
          run_once: true
          become: false
        - name: Download Elasticsearch snapshot deb
          ansible.builtin.get_url:
            url: "{{ es_artifact.json.packages['elasticsearch-' + elastic_version + '-' + elastic_deb_arch + '.deb'].url }}"
            dest: "/tmp/elasticsearch-{{ elastic_version }}.deb"
            timeout: 300
          register: es_snapshot_deb_dl
          until: es_snapshot_deb_dl is succeeded
          retries: 3
          delay: 15
        - name: Install Elasticsearch deb
          ansible.builtin.apt:
            deb: "/tmp/elasticsearch-{{ elastic_version }}.deb"
            state: present

    - name: Create certs directory
      ansible.builtin.file:
        path: /etc/elasticsearch/certs
        state: directory
        owner: root
        group: elasticsearch
        mode: '0750'

    - name: Copy CA certificate
      ansible.builtin.copy:
        src: "{{ certs_dir }}/ca.crt"
        dest: /etc/elasticsearch/certs/ca.crt
        owner: root
        group: elasticsearch
        mode: '0640'

    - name: Copy Elasticsearch certificate
      ansible.builtin.copy:
        src: "{{ certs_dir }}/es.crt"
        dest: /etc/elasticsearch/certs/es.crt
        owner: root
        group: elasticsearch
        mode: '0640'

    - name: Copy Elasticsearch private key
      ansible.builtin.copy:
        src: "{{ certs_dir }}/es.key"
        dest: /etc/elasticsearch/certs/es.key
        owner: root
        group: elasticsearch
        mode: '0640'

    - name: Configure Elasticsearch
      ansible.builtin.template:
        src: templates/elasticsearch.yml.j2
        dest: /etc/elasticsearch/elasticsearch.yml
        owner: root
        group: elasticsearch
        mode: '0660'
      notify: Restart Elasticsearch

    - name: Set vm.max_map_count
      ansible.posix.sysctl:
        name: vm.max_map_count
        value: '262144'
        state: present
        sysctl_file: /etc/sysctl.d/99-elasticsearch.conf
        reload: true

    - name: Enable and start Elasticsearch
      ansible.builtin.systemd:
        name: elasticsearch
        enabled: true
        state: started
      register: es_start
      ignore_errors: true

    - name: Collect Elasticsearch journal logs on failure
      ansible.builtin.command: journalctl -u elasticsearch.service --no-pager -n 50
      register: es_journal
      when: es_start is failed

    - name: Show Elasticsearch journal logs
      ansible.builtin.fail:
        msg: "{{ es_journal.stdout }}"
      when: es_start is failed

    - name: Wait for Elasticsearch port to open
      ansible.builtin.wait_for:
        port: 9200
        timeout: 60

    - name: Set elastic user password
      ansible.builtin.shell: |
        printf '%s\n%s\n' "{{ elastic_password }}" "{{ elastic_password }}" | \
        /usr/share/elasticsearch/bin/elasticsearch-reset-password -u elastic -i -s -b
      no_log: true
      changed_when: true

    - name: Delete existing Kibana service account token
      ansible.builtin.uri:
        url: "https://{{ ansible_host }}:9200/_security/service/elastic/kibana/credential/token/ansible-managed"
        timeout: 300
        method: DELETE
        user: elastic
        password: "{{ elastic_password }}"
        ca_path: "{{ certs_dir }}/ca.crt"
        status_code: [200, 404]
      delegate_to: localhost
      become: false
      no_log: true

    - name: Create Kibana service account token
      ansible.builtin.uri:
        url: "https://{{ ansible_host }}:9200/_security/service/elastic/kibana/credential/token/ansible-managed"
        timeout: 300
        method: POST
        user: elastic
        password: "{{ elastic_password }}"
        ca_path: "{{ certs_dir }}/ca.crt"
      delegate_to: localhost
      become: false
      register: kibana_token_response
      no_log: true

    - name: Store Kibana service token as host fact
      ansible.builtin.set_fact:
        kibana_service_token: "{{ kibana_token_response.json.token.value }}"
      no_log: true

    - name: Delete existing Fleet Server service account token
      ansible.builtin.uri:
        url: "https://{{ ansible_host }}:9200/_security/service/elastic/fleet-server/credential/token/ansible-managed"
        timeout: 300
        method: DELETE
        user: elastic
        password: "{{ elastic_password }}"
        ca_path: "{{ certs_dir }}/ca.crt"
        status_code: [200, 404]
      delegate_to: localhost
      become: false
      no_log: true

    - name: Create Fleet Server service account token
      ansible.builtin.uri:
        url: "https://{{ ansible_host }}:9200/_security/service/elastic/fleet-server/credential/token/ansible-managed"
        timeout: 300
        method: POST
        user: elastic
        password: "{{ elastic_password }}"
        ca_path: "{{ certs_dir }}/ca.crt"
      delegate_to: localhost
      become: false
      register: fleet_token_response
      no_log: true

    - name: Store Fleet Server service token as host fact
      ansible.builtin.set_fact:
        fleet_service_token: "{{ fleet_token_response.json.token.value }}"
      no_log: true

  handlers:
    - name: Restart Elasticsearch
      ansible.builtin.systemd:
        name: elasticsearch
        state: restarted

# Play 4: Install and configure Kibana
- name: Install and configure Kibana
  hosts: kibana
  become: true
  vars_files: [vars.yml]
  any_errors_fatal: true

  tasks:
    - name: Install prerequisites
      ansible.builtin.apt:
        name:
          - apt-transport-https
          - gnupg
          - curl
        state: present
        update_cache: true

    - name: Install headless Chromium dependencies for Kibana reporting
      ansible.builtin.apt:
        name:
          - fonts-liberation
          - libfontconfig1
          - libnss3
        state: present

    - name: Add Elastic GPG key
      ansible.builtin.shell:
        cmd: curl -fsSL https://artifacts.elastic.co/GPG-KEY-elasticsearch | gpg --dearmor -o /usr/share/keyrings/elasticsearch-keyring.gpg
        creates: /usr/share/keyrings/elasticsearch-keyring.gpg

    - name: Install Kibana via apt repository
      when: not (elastic_is_snapshot | bool)
      block:
        - name: Add Elastic apt repository
          ansible.builtin.apt_repository:
            repo: "deb [signed-by=/usr/share/keyrings/elasticsearch-keyring.gpg] {{ elastic_repo_url }} stable main"
            state: present
            filename: "elastic-{{ elastic_major_version }}.x"
        - name: Install Kibana
          ansible.builtin.apt:
            name: "kibana={{ elastic_version_apt }}"
            state: present
            update_cache: true
            allow_downgrade: true

    - name: Install Kibana from snapshot deb
      when: elastic_is_snapshot | bool
      block:
        - name: Look up Kibana snapshot package URL
          ansible.builtin.uri:
            url: "{{ elastic_artifacts_api }}/kibana-{{ elastic_version }}-{{ elastic_deb_arch }}.deb"
            timeout: 300
            return_content: true
          register: kibana_artifact
          delegate_to: localhost
          run_once: true
          become: false
        - name: Download Kibana snapshot deb
          ansible.builtin.get_url:
            url: "{{ kibana_artifact.json.packages['kibana-' + elastic_version + '-' + elastic_deb_arch + '.deb'].url }}"
            dest: "/tmp/kibana-{{ elastic_version }}.deb"
            timeout: 300
          register: kibana_snapshot_deb_dl
          until: kibana_snapshot_deb_dl is succeeded
          retries: 3
          delay: 15
        - name: Install Kibana deb
          ansible.builtin.apt:
            deb: "/tmp/kibana-{{ elastic_version }}.deb"
            state: present

    - name: Create certs directory
      ansible.builtin.file:
        path: /etc/kibana/certs
        state: directory
        owner: root
        group: kibana
        mode: '0750'

    - name: Copy CA certificate
      ansible.builtin.copy:
        src: "{{ certs_dir }}/ca.crt"
        dest: /etc/kibana/certs/ca.crt
        owner: root
        group: kibana
        mode: '0640'

    - name: Copy Kibana certificate
      ansible.builtin.copy:
        src: "{{ certs_dir }}/kibana.crt"
        dest: /etc/kibana/certs/kibana.crt
        owner: root
        group: kibana
        mode: '0640'

    - name: Copy Kibana private key
      ansible.builtin.copy:
        src: "{{ certs_dir }}/kibana.key"
        dest: /etc/kibana/certs/kibana.key
        owner: root
        group: kibana
        mode: '0640'

    - name: Configure Kibana
      ansible.builtin.template:
        src: templates/kibana.yml.j2
        dest: /etc/kibana/kibana.yml
        owner: root
        group: kibana
        mode: '0660'
      notify: Restart Kibana

    - name: Flush handlers
      ansible.builtin.meta: flush_handlers

    - name: Enable and start Kibana
      ansible.builtin.systemd:
        name: kibana
        enabled: true
        state: started

    - name: Wait for Kibana Fleet API to be ready
      ansible.builtin.uri:
        url: "https://{{ ansible_host }}:5601/api/fleet/settings"
        timeout: 300
        user: elastic
        password: "{{ elastic_password }}"
        force_basic_auth: true
        ca_path: "{{ certs_dir }}/ca.crt"
        status_code: 200
      delegate_to: localhost
      become: false
      register: kibana_fleet_ready
      until: kibana_fleet_ready.status == 200
      retries: 30
      delay: 10
      no_log: true

    - name: Get existing Fleet Server hosts
      ansible.builtin.uri:
        url: "https://{{ ansible_host }}:5601/api/fleet/fleet_server_hosts"
        timeout: 300
        user: elastic
        password: "{{ elastic_password }}"
        force_basic_auth: true
        ca_path: "{{ certs_dir }}/ca.crt"
      delegate_to: localhost
      become: false
      register: existing_fleet_hosts

    - name: Create Fleet Server host entry
      ansible.builtin.uri:
        url: "https://{{ ansible_host }}:5601/api/fleet/fleet_server_hosts"
        timeout: 300
        method: POST
        headers:
          kbn-xsrf: "true"
        body_format: json
        body:
          name: "default"
          host_urls:
            - "https://{{ hostvars['fleet_server']['internal_ip'] | default(hostvars['fleet_server']['ansible_host']) }}:8220"
          is_default: true
        user: elastic
        password: "{{ elastic_password }}"
        force_basic_auth: true
        ca_path: "{{ certs_dir }}/ca.crt"
      delegate_to: localhost
      become: false
      when: existing_fleet_hosts.json.total == 0

    - name: Update existing Fleet Server host entry
      ansible.builtin.uri:
        url: "https://{{ ansible_host }}:5601/api/fleet/fleet_server_hosts/{{ existing_fleet_hosts.json['items'][0].id }}"
        timeout: 300
        method: PUT
        headers:
          kbn-xsrf: "true"
        body_format: json
        body:
          name: "default"
          host_urls:
            - "https://{{ hostvars['fleet_server']['internal_ip'] | default(hostvars['fleet_server']['ansible_host']) }}:8220"
          is_default: true
        user: elastic
        password: "{{ elastic_password }}"
        force_basic_auth: true
        ca_path: "{{ certs_dir }}/ca.crt"
      delegate_to: localhost
      become: false
      when: existing_fleet_hosts.json.total > 0

    - name: Initialize Fleet
      ansible.builtin.uri:
        url: "https://{{ ansible_host }}:5601/api/fleet/setup"
        timeout: 300
        method: POST
        headers:
          kbn-xsrf: "true"
        body_format: json
        body: {}
        user: elastic
        password: "{{ elastic_password }}"
        force_basic_auth: true
        ca_path: "{{ certs_dir }}/ca.crt"
        status_code: [200, 201]
      delegate_to: localhost
      become: false

    - name: Get existing Fleet outputs
      ansible.builtin.uri:
        url: "https://{{ ansible_host }}:5601/api/fleet/outputs"
        timeout: 300
        user: elastic
        password: "{{ elastic_password }}"
        force_basic_auth: true
        ca_path: "{{ certs_dir }}/ca.crt"
      delegate_to: localhost
      become: false
      register: fleet_outputs

    - name: Set default output ID
      ansible.builtin.set_fact:
        default_output_id: "{{ fleet_outputs.json['items'] | selectattr('is_default', 'defined') | selectattr('is_default') | map(attribute='id') | first | default('') }}"

    - name: Update default Fleet output to point to Elasticsearch
      ansible.builtin.uri:
        url: "https://{{ ansible_host }}:5601/api/fleet/outputs/{{ default_output_id }}"
        timeout: 300
        method: PUT
        headers:
          kbn-xsrf: "true"
        body_format: json
        body:
          name: "default"
          type: "elasticsearch"
          hosts:
            - "https://{{ hostvars['elasticsearch']['internal_ip'] | default(hostvars['elasticsearch']['ansible_host']) }}:9200"
          is_default: true
          is_default_monitoring: true
          ssl:
            certificate_authorities:
              - "{{ lookup('file', certs_dir + '/ca.crt') }}"
        user: elastic
        password: "{{ elastic_password }}"
        force_basic_auth: true
        ca_path: "{{ certs_dir }}/ca.crt"
      delegate_to: localhost
      become: false
      when: default_output_id != ''

    - name: Create default Fleet output pointing to Elasticsearch
      ansible.builtin.uri:
        url: "https://{{ ansible_host }}:5601/api/fleet/outputs"
        timeout: 300
        method: POST
        headers:
          kbn-xsrf: "true"
        body_format: json
        body:
          name: "default"
          type: "elasticsearch"
          hosts:
            - "https://{{ hostvars['elasticsearch']['internal_ip'] | default(hostvars['elasticsearch']['ansible_host']) }}:9200"
          is_default: true
          is_default_monitoring: true
          ssl:
            certificate_authorities:
              - "{{ lookup('file', certs_dir + '/ca.crt') }}"
        user: elastic
        password: "{{ elastic_password }}"
        force_basic_auth: true
        ca_path: "{{ certs_dir }}/ca.crt"
      delegate_to: localhost
      become: false
      when: default_output_id == ''

    - name: Get all agent policies
      ansible.builtin.uri:
        url: "https://{{ ansible_host }}:5601/api/fleet/agent_policies"
        timeout: 300
        user: elastic
        password: "{{ elastic_password }}"
        force_basic_auth: true
        ca_path: "{{ certs_dir }}/ca.crt"
      delegate_to: localhost
      become: false
      register: all_policies

    - name: Set Fleet Server policy ID
      ansible.builtin.set_fact:
        fleet_server_policy_id: "{{ all_policies.json['items'] | selectattr('is_default_fleet_server', 'defined') | selectattr('is_default_fleet_server') | map(attribute='id') | first | default('') }}"

    - name: Create Fleet Server agent policy
      ansible.builtin.uri:
        url: "https://{{ ansible_host }}:5601/api/fleet/agent_policies"
        timeout: 300
        method: POST
        headers:
          kbn-xsrf: "true"
        body_format: json
        body:
          name: "Fleet Server Policy"
          namespace: "default"
          is_default_fleet_server: true
        user: elastic
        password: "{{ elastic_password }}"
        force_basic_auth: true
        ca_path: "{{ certs_dir }}/ca.crt"
        status_code: [200, 201, 409]
      delegate_to: localhost
      become: false
      when: fleet_server_policy_id == ''

    - name: Re-fetch policies to get Fleet Server policy ID
      ansible.builtin.uri:
        url: "https://{{ ansible_host }}:5601/api/fleet/agent_policies"
        timeout: 300
        user: elastic
        password: "{{ elastic_password }}"
        force_basic_auth: true
        ca_path: "{{ certs_dir }}/ca.crt"
      delegate_to: localhost
      become: false
      register: all_policies
      when: fleet_server_policy_id == ''

    - name: Update Fleet Server policy ID after creation
      ansible.builtin.set_fact:
        fleet_server_policy_id: "{{ all_policies.json['items'] | selectattr('is_default_fleet_server', 'defined') | selectattr('is_default_fleet_server') | map(attribute='id') | first }}"
      when: fleet_server_policy_id == ''

    - name: Set default agent policy ID
      ansible.builtin.set_fact:
        default_policy_id: "{{ all_policies.json['items'] | selectattr('is_default', 'defined') | selectattr('is_default') | map(attribute='id') | first | default('') }}"

    - name: Create default agent policy
      ansible.builtin.uri:
        url: "https://{{ ansible_host }}:5601/api/fleet/agent_policies"
        timeout: 300
        method: POST
        headers:
          kbn-xsrf: "true"
        body_format: json
        body:
          name: "Default Agent Policy"
          namespace: "default"
          is_default: true
        user: elastic
        password: "{{ elastic_password }}"
        force_basic_auth: true
        ca_path: "{{ certs_dir }}/ca.crt"
